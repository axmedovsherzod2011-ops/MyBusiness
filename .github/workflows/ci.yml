name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mybusiness
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @mybusiness/api build

      - name: Build web
        run: pnpm --filter @mybusiness/web build
        env:
          VITE_API_BASE_URL: https://mybusiness-api-e6dk.onrender.com

      - name: Smoke test API build
        run: |
          set -e
          node -e "const fs=require('fs'); if (!fs.existsSync('apps/api/dist/server.js')) process.exit(1);"
          node -e "const fs=require('fs'); if (!fs.existsSync('apps/web/dist/index.html')) process.exit(1);"

