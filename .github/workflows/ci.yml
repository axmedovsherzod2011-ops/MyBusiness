name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/marketplace
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @marketplace/api build

      - name: Build web
        run: pnpm --filter @marketplace/web build
        env:
          VITE_API_BASE_URL: https://mybusiness-api-e6dk.onrender.com

      - name: Smoke test API build
        run: |
          set -e
          test -f apps/api/dist/server.js
          test -f apps/web/dist/index.html
