name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/marketplace
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner Node.js
        run: |
          node --version
          npm --version

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Smoke test builds
        run: |
          set -e
          test -f apps/api/dist/server.js
          test -f apps/seller/dist/index.html
          test -f apps/customer/dist/index.html
