name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "apps/seller/**"
      - "packages/shared/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build customer
        run: pnpm --filter @marketplace/customer build
      - name: Verify customer build
        run: test -f apps/customer/dist/index.html
      - name: Build seller
        run: pnpm --filter @marketplace/seller build
      - name: Verify seller build
        run: test -f apps/seller/dist/index.html
      - name: Deploy seller Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/seller
          command: deploy --config wrangler.jsonc
      - name: Verify live seller version
        run: |
          set -e
          body="$(curl -fsSL "https://mybusiness.axmedovsherzod2011.workers.dev/?v=$GITHUB_SHA")"
          echo "$body" | grep -q "SELLER CENTER"
          echo "Live Seller Worker responded with the newly built HTML."
