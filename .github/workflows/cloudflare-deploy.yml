name: Cloudflare Build

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "apps/seller/**"
      - "packages/shared/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build seller
        run: pnpm --filter @marketplace/seller build

      - name: Verify seller build
        run: test -f apps/seller/dist/index.html

      - name: Verify Worker assets
        run: test -f apps/seller/index.html
