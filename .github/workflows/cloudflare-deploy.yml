name: Cloudflare Build

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "apps/seller/**"
      - "packages/shared/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build seller
        run: pnpm --filter @marketplace/seller build

      - name: Verify seller build
        run: test -f apps/seller/dist/index.html

      - name: Verify Worker assets
        run: test -f apps/seller/index.html

      - name: Deploy Seller Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config apps/seller/wrangler.jsonc

      - name: Verify live Seller Worker
        run: |
          set -e
          body="$(curl -fsSL "https://mybusiness.axmedovsherzod2011.workers.dev/?v=${GITHUB_SHA}")"
          echo "$body" | grep -q "SELLER CENTER"
          echo "Live Seller Worker is serving the deployed build."
