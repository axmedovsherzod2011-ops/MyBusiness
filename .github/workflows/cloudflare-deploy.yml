name: Customer Build

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build customer site
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build customer
        run: pnpm --filter @marketplace/customer build

      - name: Verify build output
        run: test -f apps/customer/dist/index.html
