<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MyBusiness Marketplace"><meta http-equiv="Cache-Control" content="no-cache">
<title>MyBusiness Market</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#171717;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.header{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:14px clamp(16px,4vw,60px);background:#fffffff5;border-bottom:1px solid #e7e8e3;backdrop-filter:blur(12px)}.logo{font-weight:950;letter-spacing:-.05em;font-size:20px;white-space:nowrap}.logo span{font-weight:600}.search{flex:1;max-width:720px;background:#f0f1ee;border:1px solid transparent;border-radius:13px;height:45px;padding:0 14px;font:inherit;outline:0}.search:focus{background:#fff;border-color:#b9beb7}.actions{margin-left:auto;font-weight:750;font-size:13px}.hero{background:linear-gradient(110deg,#eef1eb,#f8f4eb);padding:55px clamp(18px,7vw,100px);border-bottom:1px solid #e4e6df}.hero>*{max-width:1180px;margin-left:auto;margin-right:auto}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#727970}.hero h1{font-size:clamp(42px,6vw,74px);line-height:.94;letter-spacing:-.065em;margin:13px 0}.hero h1 em{font-style:normal;color:#526853}.hero p{max-width:600px;color:#656b63;line-height:1.6}.wrap{max-width:1180px;margin:auto;padding:38px 18px 70px}.bar{display:flex;justify-content:space-between;gap:15px;align-items:end}.bar h2{margin:7px 0 0;font-size:30px;letter-spacing:-.04em}.sort,.cats button{border:1px solid #dfe1dc;background:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-weight:700}.cats{display:flex;gap:8px;overflow:auto;padding:22px 0}.cats button{border-radius:99px;white-space:nowrap;cursor:pointer}.cats button.active{background:#171717;color:#fff;border-color:#171717}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e2e4df;border-radius:17px;overflow:hidden}.photo{height:240px;background:#eef0ec;position:relative;display:grid;place-items:center;color:#999;font-size:10px;font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:10px;top:10px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0001;width:36px;height:36px;font-size:19px;cursor:pointer}.body{padding:15px}.cat{font-size:9px;font-weight:900;letter-spacing:.1em;color:#788078;text-transform:uppercase}.body h3{margin:7px 0;font-size:17px}.body p{height:39px;overflow:hidden;color:#727970;font-size:12px;line-height:1.5}.buy{display:flex;justify-content:space-between;align-items:center;gap:8px}.buy strong{font-size:17px}.buy button{border:0;border-radius:9px;background:#171717;color:#fff;padding:9px 11px;font-weight:800;cursor:pointer}.buy button:disabled{background:#d8dad6;color:#777}.state{padding:60px;text-align:center;color:#777;border:1px dashed #d1d5ce;border-radius:16px}.state b{display:block;color:#252925;margin-bottom:6px}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.header{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:repeat(2,1fr)}.bar{align-items:start;flex-direction:column}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="header"><div class="logo">MYBUSINESS<span> MARKET</span></div><input id="q" class="search" placeholder="Mahsulot, brend yoki kategoriya qidiring..."><div class="actions">♡ Sevimlilar · Savat <b id="count">0</b></div></header>
<section class="hero"><div class="eyebrow">MYBUSINESS MARKETPLACE</div><h1>Kerakli mahsulotni<br><em>oson toping.</em></h1><p>Haqiqiy sellerlar joylagan mahsulotlar. Qidiring, solishtiring va savatga bir bosishda qo‘shing.</p></section>
<main class="wrap"><div class="bar"><div><div class="eyebrow">KATALOG</div><h2>Mahsulotlarni toping</h2></div><select id="sort" class="sort"><option value="new">Yangilari</option><option value="low">Arzonidan</option><option value="high">Qimmatidan</option></select></div>
<div id="cats" class="cats"></div><section id="app" class="state"><b>Mahsulotlar yuklanmoqda...</b>Bir necha soniya.</section></main>
<script>
(()=>{const API="https://mybusiness-api-e6dk.onrender.com",app=document.getElementById("app"),q=document.getElementById("q"),sort=document.getElementById("sort"),cats=document.getElementById("cats");let products=[],cat="Barchasi",fav=new Set(JSON.parse(localStorage.getItem("mb:fav")||"[]")),cart=JSON.parse(localStorage.getItem("mb:cart")||"{}");const money=n=>new Intl.NumberFormat("uz-UZ").format(Number(n))+" so'm";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]));const category=p=>{let t=(p.name+" "+p.description).toLowerCase();if(/telefon|phone|laptop|noutbuk|quloqchin|naushnik|charger|zaryad|mouse|klaviatura/.test(t))return"Elektronika";if(/krem|shampun|parfyum|kosmet|rouge|lipstick|makeup|soch|teri/.test(t))return"Go'zallik";if(/futbolka|ko'ylak|kurtka|shim|kiyim|dress|shirt/.test(t))return"Kiyim";if(/sumka|soat|ko'zoynak|aksessuar|bag|watch/.test(t))return"Aksessuarlar";if(/idish|oshxona|uy|yostiq|choyshab|clean/.test(t))return"Uy uchun";return"Boshqa"};function renderCats(){cats.innerHTML=["Barchasi","Elektronika","Uy uchun","Go'zallik","Kiyim","Aksessuarlar"].map(x=>'<button class="'+(cat===x?"active":"")+'" data-cat="'+x+'">'+x+"</button>").join("");cats.onclick=e=>{if(e.target.dataset.cat){cat=e.target.dataset.cat;renderCats();render()}}}function render(){let n=q.value.trim().toLowerCase(),a=products.filter(p=>(!n||(p.name+" "+p.description).toLowerCase().includes(n))&&(cat==="Barchasi"||category(p)===cat));a.sort((x,y)=>sort.value==="low"?x.price-y.price:sort.value==="high"?y.price-x.price:y.createdAt.localeCompare(x.createdAt));document.getElementById("count").textContent=Object.values(cart).reduce((s,x)=>s+x,0);if(!a.length){app.className="state";app.innerHTML="<b>Mahsulot topilmadi.</b>Qidiruv yoki kategoriyani o‘zgartirib ko‘ring.";return}app.className="grid";app.innerHTML=a.map(p=>'<article class="card"><div class="photo">'+(p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="'+esc(p.name)+'" loading="lazy">':"NO IMAGE")+'<button class="heart" data-f="'+p.id+'">'+(fav.has(p.id)?"♥":"♡")+'</button></div><div class="body"><div class="cat">'+esc(category(p))+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||"Mahsulot tavsifi kiritilmagan.")+'</p><div class="buy"><strong>'+money(p.price)+'</strong><button data-a="'+p.id+'" '+(p.stock<=0?"disabled":"")+'>'+(p.stock>0?"Savatga +":"Tugagan")+"</button></div></div></article>").join("")}app.onclick=e=>{let f=e.target.dataset.f,a=e.target.dataset.a;if(f){let id=Number(f);fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem("mb:fav",JSON.stringify([...fav]));render()}if(a){let p=products.find(x=>x.id===Number(a));if(p){cart[p.id]=Math.min((cart[p.id]||0)+1,p.stock);localStorage.setItem("mb:cart",JSON.stringify(cart));render()}}};q.oninput=render;sort.onchange=render;renderCats();fetch(API+"/api/v1/products",{headers:{Accept:"application/json"}}).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.message||"API xatosi: "+r.status);products=d.products||[];render()})).catch(e=>{app.className="state";app.innerHTML="<b>Marketplace API bilan ulanishda xatolik.</b>"+esc(e.message)})})()
</script></body></html>
