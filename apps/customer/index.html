<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyBusiness Marketplace" />
    <title>MyBusiness Marketplace</title>
    <style>
      *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#171923}
      .wrap{max-width:1200px;margin:auto;padding:32px 20px 60px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
      .brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:#6b7280}.title{font-size:38px;line-height:1.1;margin:7px 0}.sub{margin:0;color:#6b7280}
      .pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
      .card{background:#fff;border:1px solid #e7e8ee;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(20,24,40,.05)}
      .photo{height:230px;background:#eef0f5;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px;font-weight:800;letter-spacing:.08em}
      .photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:17px}.stock{font-size:12px;font-weight:800;color:#16803c;margin-bottom:7px}.stock.out{color:#b42318}
      h2{font-size:19px;margin:0 0 7px}.desc{font-size:14px;line-height:1.5;color:#6b7280;min-height:42px;margin:0 0 14px}.price{font-size:21px}
      .state{padding:48px 20px;text-align:center;background:#fff;border:1px solid #e7e8ee;border-radius:18px;color:#6b7280}.state strong{display:block;color:#171923;font-size:18px;margin-bottom:7px}
      .error{border-color:#fecaca;background:#fff7f7}.error strong{color:#b42318}
      @media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.title{font-size:30px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div><div class="brand">MYBUSINESS MARKETPLACE</div><h1 class="title">Mahsulotlar</h1><p class="sub">Seller qo‘shgan mahsulotlar real bazadan olinadi.</p></div>
        <div class="pill">● LIVE DATABASE</div>
      </header>
      <section id="app" class="state"><strong>Mahsulotlar yuklanmoqda...</strong><span>Ma'lumotlar bazadan olinmoqda.</span></section>
    </main>
    <script>
      (() => {
        const apiBase = "https://mybusiness-api-e6dk.onrender.com";
        const app = document.getElementById("app");
        const money = (n) => new Intl.NumberFormat("uz-UZ").format(Number(n)) + " so'm";
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
        fetch(apiBase + "/api/v1/products", { headers: { Accept: "application/json" } })
          .then(async r => {
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.message || "API xatosi: " + r.status);
            return data;
          })
          .then(data => {
            const products = Array.isArray(data.products) ? data.products : [];
            if (!products.length) {
              app.className = "state";
              app.innerHTML = "<strong>Hozircha mahsulot yo‘q.</strong><span>Seller saytida mahsulot qo‘shilganda shu yerda avtomatik paydo bo‘ladi.</span>";
              return;
            }
            app.className = "grid";
            app.innerHTML = products.map(p => {
              const image = p.imageUrl ? '<img src="' + esc(p.imageUrl) + '" alt="' + esc(p.name) + '" loading="lazy">' : "NO IMAGE";
              const stock = Number(p.stock) > 0 ? esc(p.stock) + " dona mavjud" : "Tugagan";
              return '<article class="card"><div class="photo">' + image + '</div><div class="body"><div class="stock ' + (Number(p.stock) > 0 ? "" : "out") + '">' + stock + '</div><h2>' + esc(p.name) + '</h2><p class="desc">' + esc(p.description || "Mahsulot tavsifi kiritilmagan.") + '</p><strong class="price">' + money(p.price) + '</strong></div></article>';
            }).join("");
          })
          .catch(err => {
            app.className = "state error";
            app.innerHTML = "<strong>Marketplace API bilan ulanishda xatolik.</strong><span>" + esc(err.message) + "</span>";
          });
      })();
    </script>
  </body>
</html>
