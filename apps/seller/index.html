<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MyBusiness Seller Center"><title>MyBusiness Seller Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#171923;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 20px 60px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#687083}.title{font-size:38px;margin:7px 0}.sub{margin:0;color:#687083}.pill{background:#fff;border:1px solid #e3e5eb;border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:18px}.panel{background:#fff;border:1px solid #e3e5eb;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(20,24,40,.05)}h2{margin:0;font-size:20px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.live{font-size:11px;font-weight:800;color:#16803c}
label{display:block;font-size:13px;font-weight:700;margin:14px 0}input,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #d9dce4;border-radius:10px;font:inherit;background:#fff}textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}small{display:block;color:#8a91a0;font-weight:400;margin-top:6px}
button{width:100%;border:0;border-radius:11px;padding:13px;font:inherit;font-weight:800;background:#171923;color:#fff;cursor:pointer;margin-top:8px}button:disabled{opacity:.6}.message{margin-top:12px;padding:11px;border-radius:10px;background:#f0f8f2;font-size:13px}
.state{text-align:center;padding:50px 15px;color:#687083}.state strong{display:block;color:#171923;margin-bottom:6px}.error{color:#b42318}.list{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;border:1px solid #eceef2;border-radius:13px;padding:10px}.thumb{width:64px;height:64px;border-radius:10px;background:#eef0f5;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;color:#8a91a0}.thumb img{width:100%;height:100%;object-fit:cover}.info strong{display:block}.info span{display:block;color:#687083;font-size:13px;margin-top:4px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.title{font-size:30px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">MYBUSINESS SELLER CENTER</div><h1 class="title">Mahsulotlar</h1><p class="sub">Mahsulotlarni haqiqiy marketplace bazasiga qo‘shing.</p></div><div class="pill">● LIVE DATABASE</div></header>
<section class="grid">
<form class="panel" id="form"><div class="panelhead"><h2>Yangi mahsulot</h2><span class="live">DB LIVE</span></div>
<label>Mahsulot nomi<input id="name" required maxlength="180" placeholder="Masalan: Wireless Headphones"></label>
<label>Tavsif<textarea id="description" rows="4" placeholder="Mahsulot haqida qisqacha ma'lumot..."></textarea></label>
<div class="two"><label>Narx<input id="price" required type="number" min="0" step="0.01" placeholder="0"></label><label>Qoldiq<input id="stock" required type="number" min="0" step="1" value="0"></label></div>
<label>Rasm URL<input id="imageUrl" type="url" placeholder="https://..."><small>Hozircha rasm URL orqali qo‘shiladi.</small></label>
<button id="save" type="submit">Mahsulotni bazaga qo‘shish</button><div id="message"></div></form>
<section class="panel"><div class="panelhead"><h2>Bazadagi mahsulotlar</h2><span id="count"></span></div><div id="products" class="state">Yuklanmoqda...</div></section>
</section></main>
<script>
(()=>{const API="https://mybusiness-api-e6dk.onrender.com";const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat("uz-UZ").format(Number(n))+" so'm";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let products=[];
async function load(){const box=$("products");try{const r=await fetch(API+"/api/v1/products",{headers:{Accept:"application/json"}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"API xatosi: "+r.status);products=d.products||[];render()}catch(e){box.className="state error";box.innerHTML="<strong>API bilan ulanishda xatolik</strong><span>"+esc(e.message)+"</span>"}}
function render(){ $("count").textContent=products.length+" ta";const box=$("products");if(!products.length){box.className="state";box.innerHTML="<strong>Hali mahsulot yo‘q.</strong><span>Chapdagi forma orqali mahsulot qo‘shing.</span>";return}box.className="list";box.innerHTML=products.map(p=>'<article class="row"><div class="thumb">'+(p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="">':"NO IMAGE")+'</div><div class="info"><strong>'+esc(p.name)+'</strong><span>'+money(p.price)+" · "+esc(p.stock)+" dona</span></div></article>").join("")}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("save").disabled=true;$("save").textContent="Saqlanmoqda...";$("message").textContent="";try{const body={name:$("name").value.trim(),description:$("description").value.trim(),price:Number($("price").value),stock:Number($("stock").value),imageUrl:$("imageUrl").value.trim()};const r=await fetch(API+"/api/v1/products",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Mahsulot saqlanmadi.");products.unshift(d.product);render();$("form").reset();$("stock").value="0";$("message").textContent="Mahsulot bazaga saqlandi."}catch(e){$("message").textContent=e.message}finally{$("save").disabled=false;$("save").textContent="Mahsulotni bazaga qo‘shish"}});load()})()
</script></body></html>
