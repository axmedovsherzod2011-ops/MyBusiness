<!doctype html>
<html lang="uz">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>MyBusiness Seller Center</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#171917;font-family:Inter,system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#171917;color:#fff;padding:25px 16px}.brand{font-weight:950;font-size:17px;padding:8px 9px 25px}.brand span{color:#aeb5aa;font-weight:500}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9c0b6;text-align:left;border-radius:10px;padding:11px 12px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#30352f;color:#fff}.main{max-width:1180px;width:100%;padding:38px clamp(18px,4vw,55px)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.ey{font-size:10px;font-weight:900;letter-spacing:.16em;color:#778078}.top h1{font-size:clamp(34px,5vw,58px);line-height:.95;letter-spacing:-.06em;margin:9px 0 8px}.top p{margin:0;color:#747b74}.status{padding:9px 12px;border-radius:99px;background:#eef8f0;color:#197243;font-size:11px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid #e1e4df;border-radius:18px;padding:18px}.stat span{display:block;color:#7c837b;font-size:11px}.stat b{display:block;margin-top:9px;font-size:22px}.panel{margin-top:16px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.head h2{margin:0;font-size:19px}.search{border:1px solid #dfe2dd;border-radius:9px;padding:10px;width:240px}.rows{display:grid;gap:8px;margin-top:18px}.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:9px;border:1px solid #eceeea;border-radius:12px}.thumb{width:54px;height:54px;border-radius:9px;background:#f0f1ee;display:grid;place-items:center;color:#969d95;font-size:9px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.row b,.row span{display:block}.row span{color:#7d847d;font-size:11px;margin-top:4px}.add{max-width:720px}.add label{display:grid;gap:7px;margin:15px 0;font-size:12px;font-weight:800;color:#555d55}.add input,.add textarea{width:100%;border:1px solid #dce0da;border-radius:10px;padding:12px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;border:0;border-radius:10px;padding:13px;background:#171917;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#eef5ef;color:#546155;font-size:12px}.empty{text-align:center;padding:55px;color:#7d847d}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px 15px}.brand{padding:5px 4px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:start;flex-direction:column}}@media(max-width:560px){.stats,.two{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.search{width:100%}}</style></head>
<body><div class="shell"><aside class="side"><div class="brand">MYBUSINESS <span>SELLER</span></div><nav class="nav"><button class="active" data-tab="dash">Dashboard</button><button data-tab="products">Mahsulotlar</button><button data-tab="inventory">Ombor</button><button data-tab="add">+ Mahsulot qo‘shish</button></nav></aside><main class="main"><header class="top"><div><div class="ey">SELLER CENTER</div><h1 id="title">Dashboard</h1><p>Do‘koningizni bitta joydan boshqaring.</p></div><div class="status">● LIVE DATABASE</div></header><section id="content"></section></main></div>
<script>
(()=>{const API="https://mybusiness-api-e6dk.onrender.com",content=document.getElementById("content"),title=document.getElementById("title");let products=[];const money=n=>new Intl.NumberFormat("uz-UZ").format(Number(n))+" so'm";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]));function dashboard(){title.textContent="Dashboard";let stock=products.reduce((s,p)=>s+p.stock,0),value=products.reduce((s,p)=>s+p.price*p.stock,0),out=products.filter(p=>p.stock===0).length;content.innerHTML='<div class="stats"><div class="stat"><span>Mahsulotlar</span><b>'+products.length+'</b></div><div class="stat"><span>Ombordagi dona</span><b>'+stock+'</b></div><div class="stat"><span>Ombor qiymati</span><b>'+money(value)+'</b></div><div class="stat"><span>Tugagan</span><b>'+out+'</b></div></div><section class="panel"><div class="head"><h2>Tezkor amallar</h2></div><p>Mahsulotlaringiz real Neon bazasidan olinmoqda. Customer saytida ham shu ma’lumotlar ko‘rinadi.</p><button class="primary" data-tab="add">+ Yangi mahsulot</button></section>'}function list(tab){title.textContent=tab==="inventory"?"Ombor":"Mahsulotlar";content.innerHTML='<section class="panel"><div class="head"><h2>'+title.textContent+'</h2><input id="q" class="search" placeholder="Qidirish..."></div><div id="rows" class="rows"></div></section>';const draw=()=>{let q=document.getElementById("q").value.toLowerCase(),a=products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q)),rows=document.getElementById("rows");rows.innerHTML=a.length?a.map(p=>'<div class="row"><div class="thumb">'+(p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="">':"NO IMAGE")+'</div><div><b>'+esc(p.name)+'</b><span>'+money(p.price)+'</span></div><strong>'+p.stock+' dona</strong></div>').join(""):'<div class="empty">Mahsulot topilmadi.</div>'};document.getElementById("q").oninput=draw;draw()}function add(){title.textContent="Yangi mahsulot";content.innerHTML='<section class="panel add"><h2>Yangi mahsulot</h2><form id="form"><label>Mahsulot nomi<input id="name" required maxlength="180" placeholder="Masalan: Wireless Headphones"></label><label>Tavsif<textarea id="desc" rows="5" placeholder="Mahsulotni xaridor uchun tushunarli qilib yozing..."></textarea></label><div class="two"><label>Narx<input id="price" required type="number" min="0" step=".01"></label><label>Qoldiq<input id="stock" required type="number" min="0" value="0"></label></div><label>Rasm URL<input id="image" type="url" placeholder="https://..."></label><button class="primary">Mahsulotni bazaga qo‘shish</button><div id="msg"></div></form></section>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();let msg=document.getElementById("msg");try{let r=await fetch(API+"/api/v1/products",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({name:document.getElementById("name").value.trim(),description:document.getElementById("desc").value.trim(),price:Number(document.getElementById("price").value),stock:Number(document.getElementById("stock").value),imageUrl:document.getElementById("image").value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.message||"Saqlanmadi");products.unshift(d.product);msg.textContent="Mahsulot bazaga saqlandi.";render("products")}catch(e){msg.textContent=e.message}}}function render(t){t==="products"?list(t):t==="inventory"?list(t):t==="add"?add():dashboard()}document.querySelector(".nav").onclick=e=>{if(e.target.dataset.tab){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active");render(e.target.dataset.tab)}};content.onclick=e=>{if(e.target.dataset.tab)render(e.target.dataset.tab)};fetch(API+"/api/v1/products",{headers:{Accept:"application/json"}}).then(r=>r.json()).then(d=>{products=d.products||[];render("dash")}).catch(()=>{products=[];render("dash")})})()
</script></body></html>
