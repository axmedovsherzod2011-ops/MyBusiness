services:
  - type: web
    name: mybusiness-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @mybusiness/api build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
