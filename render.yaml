services:
  - type: web
    name: mybusiness-api
    runtime: node
    plan: free
    rootDir: ""
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @mybusiness/api build
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/server.js
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: DB_AUTO_PUSH
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: mybusiness-d48d1
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
