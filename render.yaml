services:
  - type: web
    name: mybusiness-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @mybusiness/api build
    startCommand: pnpm --filter @mybusiness/api start
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
